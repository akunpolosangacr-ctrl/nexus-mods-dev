<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Mods Dev - Lua Vault</title>
  <link rel="stylesheet" href="style.css">
  <!-- Feather Icons CDN -->
  <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <i data-feather="cpu"></i>
        <h1>Nexus Mods Dev</h1>
      </div>
      <p>Secure Lua Script Deployer & Database Vault</p>
    </header>

    <!-- Form Deploy -->
    <section class="card">
      <h2><i data-feather="upload-cloud"></i> Deploy New Lua Script</h2>
      <form id="deployForm">
        <div class="form-group">
          <label for="scriptName">Nama Script / Mod</label>
          <input type="text" id="scriptName" placeholder="Contoh: Nexus_AutoFarm_V1" required>
        </div>

        <div class="form-group">
          <label for="expireDays">Masa Expired (Hari)</label>
          <input type="number" id="expireDays" min="1" value="7" required>
        </div>

        <div class="form-group">
          <label>Pilih File Lua dari Penyimpanan Internal</label>
          <div class="file-upload-wrapper">
            <input type="file" id="luaFileInput" accept=".lua,.txt">
            <label for="luaFileInput" class="btn-file"><i data-feather="folder"></i> Browse .lua File</label>
            <span id="fileNameDisplay">Belum ada file dipilih</span>
          </div>
        </div>

        <div class="form-group">
          <label for="luaCode">Atau Paste Kode Lua Di Sini</label>
          <textarea id="luaCode" rows="8" placeholder="-- Nexus Mods Dev Code&#10;print('Nexus Loaded Successfully!')" required></textarea>
        </div>

        <button type="submit" id="btnSubmit"><i data-feather="send"></i> Deploy to Database</button>
      </form>
    </section>

    <!-- List Script Ter-deploy -->
    <section class="card">
      <h2><i data-feather="database"></i> Deployed Scripts</h2>
      <div id="scriptList" class="script-list">
        <p class="loading-text">Memuat script...</p>
      </div>
    </section>
  </div>

  <!-- Modal Edit (Pop-up di Tengah) -->
  <div id="editModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3><i data-feather="edit-3"></i> Edit Script - Nexus Mods Dev</h3>
        <button class="btn-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="editForm">
        <input type="hidden" id="editScriptId">
        <div class="form-group">
          <label for="editScriptName">Nama Script</label>
          <input type="text" id="editScriptName" required>
        </div>
        <div class="form-group">
          <label for="editExpireDays">Perpanjang Expired (Hari dari sekarang)</label>
          <input type="number" id="editExpireDays" min="1" required>
        </div>
        <div class="form-group">
          <label for="editLuaCode">Kode Lua</label>
          <textarea id="editLuaCode" rows="8" required></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeModal()">Batal</button>
          <button type="submit" class="btn-save"><i data-feather="check"></i> Simpan Perubahan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="icon.js"></script>
</body>
</html>
