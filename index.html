<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Mods Dev - Dashboard Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0b0f19; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; padding: 20px; }
    .container { max-width: 700px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 25px; }
    .header h1 { font-size: 24px; color: #38bdf8; }
    .header p { color: #64748b; font-size: 14px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
    .card h2 { font-size: 16px; margin-bottom: 15px; color: #f8fafc; display: flex; align-items: center; gap: 8px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 5px; }
    input, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; color: #fff; font-size: 14px; outline: none; }
    input:focus, textarea:focus { border-color: #38bdf8; }
    textarea { height: 120px; font-family: monospace; resize: vertical; }
    button { width: 100%; background: #0284c7; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    .script-item { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 15px; margin-bottom: 10px; }
    .script-item .title { font-weight: bold; color: #38bdf8; font-size: 15px; }
    .script-item .key { font-family: monospace; color: #f59e0b; margin: 5px 0; font-size: 13px; }
    .script-item .info { font-size: 12px; color: #64748b; margin-bottom: 10px; }
    .btn-group { display: flex; gap: 8px; }
    .btn-group button { font-size: 12px; padding: 6px 10px; }
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🚀 Nexus Mods Dev</h1>
      <p>Key & Script Manager (Neon Database Connected)</p>
    </div>

    <!-- Form Create Key / Script -->
    <div class="card">
      <h2>🔑 Deploy Key / Script Baru</h2>
      <div class="form-group">
        <label>Nama Script / Mod</label>
        <input type="text" id="scriptName" placeholder="Contoh: Auto Farm VIP">
      </div>
      <div class="form-group">
        <label>Custom Key (Opsional - Kosongkan jika mau acak)</label>
        <input type="text" id="customKey" placeholder="Contoh: NEXUS-VIP-123">
      </div>
      <div class="form-group">
        <label>Masa Expired (Hari)</label>
        <input type="number" id="expireDays" value="30">
      </div>
      <div class="form-group">
        <label>Kode Lua Script</label>
        <textarea id="luaCode" placeholder="gg.alert('Welcome VIP User!')"></textarea>
      </div>
      <button onclick="createScript()">Simpan & Deploy Key</button>
    </div>

    <!-- List Key / Script -->
    <div class="card">
      <h2>📜 Daftar Key Terdaftar</h2>
      <div id="scriptList">Memuat data dari Neon DB...</div>
    </div>
  </div>

  <script>
    const API_URL = '/api/connect';

    async function loadScripts() {
      const container = document.getElementById('scriptList');
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'list' })
        });
        const data = await res.json();

        if (!data.success || !data.scripts.length) {
          container.innerHTML = '<p style="color:#64748b; font-size:13px;">Belum ada key/script terdaftar di database.</p>';
          return;
        }

        container.innerHTML = data.scripts.map(s => {
          const exp = new Date(s.expiresAt).toLocaleDateString('id-ID');
          return `
            <div class="script-item">
              <div class="title">${s.name}</div>
              <div class="key">🔑 Key: <b>${s.key}</b></div>
              <div class="info">Masa Aktif s/d: ${exp}</div>
              <div class="btn-group">
                <button onclick="copyLoader('${s.key}')">Salin Script Loader GG</button>
                <button class="btn-danger" onclick="deleteScript('${s.key}')">Hapus</button>
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {
        container.innerHTML = '<p style="color:#ef4444; font-size:13px;">Gagal mengambil data dari database.</p>';
      }
    }

    async function createScript() {
      const name = document.getElementById('scriptName').value || 'Untitled Script';
      const customKey = document.getElementById('customKey').value;
      const expireDays = document.getElementById('expireDays').value || 30;
      const luaCode = document.getElementById('luaCode').value || 'gg.toast("Hello World")';

      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'create', name, customKey, expireDays, luaCode })
      });
      const data = await res.json();
      if (data.success) {
        alert('Key berhasil dibuat! Key ID: ' + data.key);
        document.getElementById('scriptName').value = '';
        document.getElementById('customKey').value = '';
        document.getElementById('luaCode').value = '';
        loadScripts();
      } else {
        alert('Gagal: ' + data.message);
      }
    }

    async function deleteScript(key) {
      if (!confirm('Yakin ingin menghapus key ini?')) return;
      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'delete', key })
      });
      loadScripts();
    }

    function copyLoader(key) {
      const loaderCode = `local url = "https://nexus-mods-dev.vercel.app/api/connect"\nlocal r = gg.makeRequest(url, {["Content-Type"]="application/json"}, '{"action":"validate_key","key":"${key}"}')\nif r and r.content then load(r.content)() else gg.alert("Gagal memuat script!") end`;
      navigator.clipboard.writeText(loaderCode);
      alert('Script Loader untuk Game Guardian berhasil disalin!');
    }

    loadScripts();
  </script>
</body>
</html>
