<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Mods Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { 
      --bg-dark: #0b1121; --bg-card: #1e293b; --bg-input: #0f172a;
      --border: #334155; --primary: #38bdf8; --text: #f8fafc; --text-muted: #94a3b8;
      --btn-green: #10b981; --btn-blue: #38bdf8; --btn-yellow: #f59e0b; --btn-red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text); padding: 30px 20px; }
    .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
    
    /* Header Area */
    .header { text-align: center; margin-bottom: 10px; border-bottom: 2px dashed var(--border); padding-bottom: 15px; }
    .header h1 { font-size: 32px; color: var(--primary); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .header p { color: var(--text-muted); font-size: 14px; margin-top: 5px; }

    /* Card Containers */
    .card { background: var(--bg-card); border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    .card-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }

    /* Form Elements */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    input, textarea { width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: var(--text); outline: none; transition: 0.2s; font-size: 14px; }
    input:focus, textarea:focus { border-color: var(--primary); }
    textarea { height: 120px; resize: vertical; font-family: monospace; }
    .input-group { display: flex; gap: 10px; margin-bottom: 15px; }

    /* Buttons */
    .btn { border: none; padding: 14px 20px; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; color: #fff; width: 100%; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn-green { background: var(--btn-green); }
    .btn-blue { background: var(--btn-blue); color: #0f172a; font-weight: 700; }
    
    /* Script / Key List */
    .script-item { background: var(--bg-input); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .script-info { display: flex; flex-direction: column; gap: 8px; }
    .script-info .title { color: var(--primary); font-size: 16px; font-weight: 700; }
    .script-info .key { display: inline-block; background: rgba(245, 158, 11, 0.1); color: var(--btn-yellow); border: 1px solid rgba(245, 158, 11, 0.2); padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: bold; font-family: monospace; width: fit-content; }
    .badges { display: flex; gap: 10px; margin-top: 4px; }
    .badge { background: var(--bg-card); border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px; font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    
    .action-btns { display: flex; gap: 8px; }
    .btn-icon { width: 40px; height: 40px; border-radius: 10px; border: none; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; transition: 0.2s; }
    .btn-icon:hover { opacity: 0.8; transform: scale(1.05); }
    .bg-yellow { background: var(--btn-yellow); }
    .bg-blue { background: #3b82f6; }
    .bg-red { background: var(--btn-red); }

    /* Swal Dark */
    .swal2-popup { background: var(--bg-card) !important; color: var(--text) !important; border-radius: 16px !important; border: 1px solid var(--border) !important; }
    .swal2-title { color: var(--primary) !important; }
    .swal2-input { background: var(--bg-input) !important; border: 1px solid var(--border) !important; color: #fff !important; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1><i data-lucide="shield"></i> NEXUS MODS ADMIN</h1>
      <p>Advanced Encryption & Device Limit Dashboard</p>
    </div>

    <!-- Universal Script Loader -->
    <div class="card">
      <div class="card-title"><i data-lucide="code"></i> Universal Script Loader</div>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">Masukkan URL target API (Vercel / Hosting Sendiri). URL akan dienkripsi menjadi struktur Array Byte.</p>
      
      <div class="form-group full" style="margin-bottom: 15px;">
        <label>CUSTOM API URL</label>
        <input type="text" id="targetApiUrl" value="https://nexus-mods-dev.vercel.app/api/connect" placeholder="https://domain.com/api.php">
      </div>
      
      <button class="btn btn-green" onclick="generateAndCopyLoader()"><i data-lucide="copy"></i> Salin Encrypted Universal Loader</button>
    </div>

    <!-- Deploy Mod -->
    <div class="card">
      <div class="card-title"><i data-lucide="key-round"></i> Deploy Mod / Script Baru</div>
      <div class="form-grid">
        <div class="form-group">
          <label>NAMA MOD</label>
          <input type="text" id="scriptName" placeholder="Contoh: Auto Headshot">
        </div>
        <div class="form-group">
          <label>CUSTOM KEY (KOSONG = ACAK)</label>
          <input type="text" id="customKey" placeholder="NEXUS-VIP-XX">
        </div>
        <div class="form-group">
          <label>BATAS DEVICE (HWID)</label>
          <input type="number" id="maxDevices" value="1" min="1">
        </div>
        <div class="form-group">
          <label>MASA AKTIF (HARI)</label>
          <input type="number" id="expireDays" value="30" min="1">
        </div>
        <div class="form-group full">
          <label>SOURCE CODE LUA (UTAMA)</label>
          <textarea id="luaCode" placeholder="gg.alert('Login Berhasil!')"></textarea>
        </div>
      </div>
      <button class="btn btn-blue" onclick="createScript()"><i data-lucide="rocket"></i> Deploy Script ke Server</button>
    </div>

    <!-- Database -->
    <div class="card">
      <div class="card-title"><i data-lucide="database"></i> Manajemen Database Key</div>
      <div id="scriptList">
        <p style="text-align: center; color: var(--text-muted); padding: 20px;"><i data-lucide="loader-2" class="lucide-spin"></i> Memuat Data...</p>
      </div>
    </div>
  </div>

  <script>
    // Konfigurasi API Endpoint untuk Dashboard Admin
    const ADMIN_API = '/api/connect';
    const SECURE_HEADER = { 'Content-Type': 'application/json', 'X-Nexus-Shield': 'Active' };

    lucide.createIcons();

    const showToast = (icon, title) => {
      Swal.fire({ toast: true, position: 'top-end', icon, title, showConfirmButton: false, timer: 3000, background: '#1e293b', color: '#fff' });
    };

    // FUNGSI ENKRIPSI URL KE BYTE ARRAY LUA
    function generateAndCopyLoader() {
      const urlInput = document.getElementById('targetApiUrl').value.trim();
      if(!urlInput) return Swal.fire('Gagal', 'URL Target API tidak boleh kosong!', 'error');

      // Convert String URL ke CharCode Array
      const charArray = urlInput.split('').map(c => c.charCodeAt(0)).join(',');

      // Struktur Loader persis seperti request
      const loaderCode = `local t = {${charArray}}
local url = ""
for i=1, #t do url = url .. string.char(t[i]) end
local r = gg.makeRequest(url, {["Content-Type"]="application/json", ["X-Nexus-Shield"]="Active"}, '{"action":"init"}')
if r and r.content then load(r.content)() else gg.alert("Gagal koneksi ke server!") end`;
      
      navigator.clipboard.writeText(loaderCode);
      Swal.fire({ title: 'Tersalin!', text: 'Loader dengan konfigurasi Byte Array siap ditempel di script.', icon: 'success' });
    }

    // LOAD DATA
    async function loadScripts() {
      const container = document.getElementById('scriptList');
      try {
        const res = await fetch(ADMIN_API, { method: 'POST', headers: SECURE_HEADER, body: JSON.stringify({ action: 'list' }) });
        const data = await res.json();

        if (!data.success || !data.scripts.length) {
          container.innerHTML = '<p style="text-align:center; color:#94a3b8; font-size:14px;">Belum ada key/mod terdaftar.</p>';
          return;
        }

        container.innerHTML = data.scripts.map(s => {
          const exp = new Date(s.expiresAt).toLocaleDateString('id-ID');
          const devCount = s.devices ? JSON.parse(s.devices).length : 0;
          return `
            <div class="script-item">
              <div class="script-info">
                <div class="title">${s.name}</div>
                <div class="key">${s.key}</div>
                <div class="badges">
                  <div class="badge"><i data-lucide="calendar" style="width:14px;"></i> Exp: ${exp}</div>
                  <div class="badge"><i data-lucide="smartphone" style="width:14px;"></i> HWID: ${devCount} / ${s.maxDevices}</div>
                </div>
              </div>
              <div class="action-btns">
                <button class="btn-icon bg-yellow" onclick="resetHWID('${s.key}')" title="Reset HWID"><i data-lucide="refresh-cw" style="width:20px;"></i></button>
                <button class="btn-icon bg-blue" onclick="editScript('${s.key}', '${s.name}', ${s.maxDevices})" title="Edit Mod"><i data-lucide="edit" style="width:20px;"></i></button>
                <button class="btn-icon bg-red" onclick="deleteScript('${s.key}')" title="Hapus"><i data-lucide="trash-2" style="width:20px;"></i></button>
              </div>
            </div>
          `;
        }).join('');
        lucide.createIcons();
      } catch (e) { container.innerHTML = '<p style="color:#ef4444; text-align:center;">Gagal koneksi ke Database.</p>'; }
    }

    // CREATE MOD
    async function createScript() {
      const name = document.getElementById('scriptName').value || 'Untitled Mod';
      const customKey = document.getElementById('customKey').value;
      const expireDays = document.getElementById('expireDays').value || 30;
      const maxDevices = document.getElementById('maxDevices').value || 1;
      const luaCode = document.getElementById('luaCode').value;

      const res = await fetch(ADMIN_API, {
        method: 'POST', headers: SECURE_HEADER,
        body: JSON.stringify({ action: 'create', name, customKey, expireDays, maxDevices, luaCode })
      });
      const data = await res.json();
      if (data.success) {
        showToast('success', 'Key Berhasil Dibuat!');
        document.getElementById('scriptName').value = ''; 
        document.getElementById('customKey').value = ''; 
        document.getElementById('luaCode').value = '';
        loadScripts();
      } else Swal.fire('Error', data.message, 'error');
    }

    // EDIT MOD
    async function editScript(key, oldName, oldMax) {
      const { value: form } = await Swal.fire({
        title: 'Edit Konfigurasi',
        html: `
          <div style="text-align:left; font-size:12px; font-weight:bold; color:#94a3b8; margin-bottom:5px;">NAMA MOD</div>
          <input id="swal-name" class="swal2-input" value="${oldName}" style="width:90%; margin: 0 0 15px 0;">
          <div style="text-align:left; font-size:12px; font-weight:bold; color:#94a3b8; margin-bottom:5px;">BATAS DEVICES (HWID)</div>
          <input id="swal-max" type="number" class="swal2-input" value="${oldMax}" style="width:90%; margin: 0;">
        `,
        showCancelButton: true, confirmButtonText: 'Simpan',
        preConfirm: () => ({ name: document.getElementById('swal-name').value, maxDevices: document.getElementById('swal-max').value })
      });
      if (form) {
        await fetch(ADMIN_API, { method: 'POST', headers: SECURE_HEADER, body: JSON.stringify({ action: 'edit', key, name: form.name, maxDevices: form.maxDevices }) });
        showToast('success', 'Tersimpan!'); loadScripts();
      }
    }

    // RESET HWID
    async function resetHWID(key) {
      const res = await Swal.fire({ title: 'Reset HWID?', text: "Semua device terdaftar akan dihapus", icon: 'warning', showCancelButton: true, confirmButtonColor: '#f59e0b', confirmButtonText: 'Ya, Reset' });
      if (res.isConfirmed) {
        await fetch(ADMIN_API, { method: 'POST', headers: SECURE_HEADER, body: JSON.stringify({ action: 'reset_hwid', key }) });
        showToast('success', 'HWID Direset!'); loadScripts();
      }
    }

    // DELETE MOD
    async function deleteScript(key) {
      const res = await Swal.fire({ title: 'Hapus Mod?', icon: 'error', showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'Ya, Hapus' });
      if (res.isConfirmed) {
        await fetch(ADMIN_API, { method: 'POST', headers: SECURE_HEADER, body: JSON.stringify({ action: 'delete', key }) });
        showToast('success', 'Mod Terhapus!'); loadScripts();
      }
    }

    loadScripts();
  </script>
</body>
</html>
