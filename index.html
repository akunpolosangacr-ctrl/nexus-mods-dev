<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Mods Dev - Base Lua & Key Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0b0f19; color: #f1f5f9; font-family: system-ui, sans-serif; padding: 20px; }
    .container { max-width: 650px; margin: 0 auto; }
    h1 { color: #38bdf8; text-align: center; margin-bottom: 20px; font-size: 22px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; margin-top: 10px; }
    input, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; color: #fff; font-size: 13px; }
    textarea { height: 120px; font-family: monospace; }
    button { width: 100%; background: #0284c7; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 15px; cursor: pointer; }
    .item { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 8px; margin-top: 10px; font-size: 13px; }
    .item-key { color: #f59e0b; font-family: monospace; font-weight: bold; margin: 5px 0; }
    .btn-danger { background: #dc2626; margin-top: 8px; padding: 6px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Nexus Mods Dev - Base Lua & Key Manager</h1>

    <div class="card">
      <h3>➕ Tambah Key & Base Lua Script</h3>
      <label>Custom Key (Bisa diisi bebas, e.g. NEXUS-VIP-01)</label>
      <input type="text" id="customKey" placeholder="NEXUS-VIP-01">
      
      <label>Nama Script / Mod</label>
      <input type="text" id="scriptName" placeholder="Auto Farm VIP">

      <label>Masa Expired (Hari)</label>
      <input type="number" id="expireDays" value="30">

      <label>Base .lua Code Asli (Script Cheat/Mod Kamu)</label>
      <textarea id="luaCode" placeholder="gg.alert('Menu Mod Aktif!')"></textarea>

      <button onclick="saveKey()">Simpan ke Database Neon</button>
    </div>

    <div class="card">
      <h3>📜 Daftar Key Terdaftar</h3>
      <div id="keyList">Memuat data dari Neon DB...</div>
    </div>
  </div>

  <script>
    async function loadKeys() {
      const res = await fetch('/api/connect', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ action: 'list' })
      });
      const data = await res.json();
      const div = document.getElementById('keyList');
      if (!data.scripts || !data.scripts.length) {
        div.innerHTML = '<p style="color:#64748b; font-size:12px;">Belum ada key terdaftar.</p>';
        return;
      }
      div.innerHTML = data.scripts.map(s => `
        <div class="item">
          <div><b>${s.name}</b></div>
          <div class="item-key">🔑 Key: ${s.key}</div>
          <div>Masa Aktif s/d: ${new Date(s.expiresAt).toLocaleDateString('id-ID')}</div>
          <button class="btn-danger" onclick="deleteKey('${s.key}')">Hapus Key</button>
        </div>
      `).join('');
    }

    async function saveKey() {
      const customKey = document.getElementById('customKey').value;
      const name = document.getElementById('scriptName').value || 'Untitled';
      const expireDays = document.getElementById('expireDays').value || 30;
      const luaCode = document.getElementById('luaCode').value || 'gg.toast("Hello")';

      const res = await fetch('/api/connect', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ action: 'create', customKey, name, expireDays, luaCode })
      });
      const data = await res.json();
      if(data.success) {
        alert('Key Berhasil Disimpan di Database!');
        document.getElementById('customKey').value = '';
        document.getElementById('luaCode').value = '';
        loadKeys();
      } else {
        alert('Gagal: ' + data.message);
      }
    }

    async function deleteKey(key) {
      if(!confirm('Hapus key ini?')) return;
      await fetch('/api/connect', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ action: 'delete', key })
      });
      loadKeys();
    }

    loadKeys();
  </script>
</body>
</html>
