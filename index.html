<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Mods Dev - Dashboard Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #f8fafc; --text-muted: #94a3b8; --primary: #38bdf8; --primary-hover: #0284c7; --danger: #ef4444; --success: #10b981; --warning: #f59e0b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; padding: 30px 20px; }
    .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
    
    /* Header */
    .header { text-align: center; padding-bottom: 10px; border-bottom: 2px dashed var(--border); }
    .header h1 { font-size: 28px; color: var(--primary); display: flex; align-items: center; justify-content: center; gap: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
    .header p { color: var(--text-muted); font-size: 14px; margin-top: 8px; }

    /* Cards */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
    .card-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; color: var(--text); display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }

    /* Forms */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 13px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    input, textarea { width: 100%; background: #0b0f19; border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; color: var(--text); font-size: 14px; outline: none; transition: all 0.2s ease; }
    input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
    textarea { height: 140px; font-family: 'Courier New', Courier, monospace; resize: vertical; }

    /* Buttons */
    .btn { background: var(--primary); color: #fff; border: none; padding: 14px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; font-size: 15px; }
    .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-success { background: var(--success); } .btn-success:hover { background: #059669; }
    
    /* Script List */
    .script-item { background: #0b0f19; border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; transition: border-color 0.2s; }
    .script-item:hover { border-color: var(--text-muted); }
    .script-info { display: flex; flex-direction: column; gap: 6px; }
    .script-info .title { font-weight: 700; color: var(--primary); font-size: 16px; }
    .script-info .key { font-family: monospace; color: var(--warning); background: rgba(245, 158, 11, 0.1); padding: 4px 10px; border-radius: 6px; font-size: 14px; width: fit-content; font-weight: bold; border: 1px solid rgba(245, 158, 11, 0.2); }
    .script-info .badges { display: flex; gap: 15px; margin-top: 5px; }
    .badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); background: var(--card); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); }
    
    .btn-group { display: flex; gap: 8px; }
    .btn-icon { padding: 8px 12px; border: none; border-radius: 8px; color: white; cursor: pointer; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: opacity 0.2s; }
    .btn-icon:hover { opacity: 0.8; }
    .bg-blue { background: #3b82f6; } .bg-red { background: var(--danger); } .bg-orange { background: var(--warning); }

    /* SweetAlert Dark Mode Customization */
    .swal2-popup { background: var(--card) !important; color: var(--text) !important; border: 1px solid var(--border) !important; border-radius: 16px !important; }
    .swal2-title { color: var(--primary) !important; }
    .swal2-input { background: #0b0f19 !important; color: #fff !important; border: 1px solid var(--border) !important; border-radius: 8px !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1><i data-lucide="shield-alert"></i> Nexus Mods Admin</h1>
      <p>Advanced Encryption & Device Limit Dashboard</p>
    </div>

    <!-- Universal Loader Section -->
    <div class="card">
      <div class="card-title"><i data-lucide="code-2"></i> Universal Script Loader</div>
      <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 15px;">Loader ini menggunakan algoritma Hex-Shift. URL server, fungsi, dan string diretas strukturnya agar sulit di-decompile (Anti-String).</p>
      <button class="btn btn-success" onclick="copyUniversalLoader()"><i data-lucide="copy"></i> Salin Encrypted Universal Loader</button>
    </div>

    <!-- Generate Key Section -->
    <div class="card">
      <div class="card-title"><i data-lucide="key-round"></i> Deploy Mod / Script Baru</div>
      <div class="form-grid">
        <div class="form-group">
          <label>Nama Mod</label>
          <input type="text" id="scriptName" placeholder="Contoh: Auto Headshot">
        </div>
        <div class="form-group">
          <label>Custom Key (Kosong = Acak)</label>
          <input type="text" id="customKey" placeholder="NEXUS-VIP-XXX">
        </div>
        <div class="form-group">
          <label>Batas Device (HWID)</label>
          <input type="number" id="maxDevices" value="1" min="1">
        </div>
        <div class="form-group">
          <label>Masa Aktif (Hari)</label>
          <input type="number" id="expireDays" value="30" min="1">
        </div>
        <div class="form-group full">
          <label>Source Code Lua (Utama)</label>
          <textarea id="luaCode" placeholder="gg.alert('Login Berhasil!')"></textarea>
        </div>
      </div>
      <button class="btn" onclick="createScript()"><i data-lucide="rocket"></i> Deploy Script ke Server</button>
    </div>

    <!-- Key Management Section -->
    <div class="card">
      <div class="card-title"><i data-lucide="database"></i> Manajemen Database Key</div>
      <div id="scriptList">
        <p style="text-align: center; color: var(--text-muted); padding: 20px;"><i data-lucide="loader-2" class="lucide-spin"></i> Memuat Data Server...</p>
      </div>
    </div>
  </div>

  <script>
    const API_URL = '/api/connect';
    const SECURE_HEADER = { 'Content-Type': 'application/json', 'X-Nexus-Shield': 'Active' };

    lucide.createIcons();

    const showToast = (icon, title) => {
      Swal.fire({ toast: true, position: 'top-end', icon, title, showConfirmButton: false, timer: 3000, background: '#1e293b', color: '#fff' });
    };

    // ALGORITMA HARD OBFUSCATOR UNTUK LOADER
    function generateObfuscatedLoader(targetUrl) {
      // 1. Shift URL String (+13 offset) to Hex
      let encodedUrl = "";
      for (let i = 0; i < targetUrl.length; i++) {
        encodedUrl += (targetUrl.charCodeAt(i) + 13).toString(16);
      }

      // 2. Build anti-decompile structure
      const loader = `
local _ENV = _ENV or getfenv()
local _A, _B, _C = string.char, table.concat, tonumber
local function _X(h)
  local r = {}
  for i = 1, #h, 2 do r[#r+1] = _A(_C(h:sub(i, i+1), 16) - 13) end
  return _B(r)
end
local _U = _X("${encodedUrl}")
local _req = _ENV[_X("6e6e")][_X("7668746c5b62747e6c7c7d")] -- gg.makeRequest obfuscated
local _ld = _ENV[_X("75786a6d")] -- load obfuscated
local _al = _ENV[_X("6e6e")][_X("6a756c7b7d")] -- gg.alert obfuscated

local r = _req(_U, {["Content-Type"]=_X("6e797975726c6a7d72787736737c7877"), ["X-Nexus-Shield"]=_X("4e6c7d727f6c")}, _X("842f6a6c7d7278772f432f7277727d2f86"))
if r and r.content then 
  local s, e = pcall(_ld(r.content))
  if not s then _al("Load Err") end
else 
  _al("Err: Server/Network") 
end
`;
      // Hapus komentar dan jadikan 1 baris panjang biar makin susah dibaca
      return loader.replace(/--.*/g, '').replace(/\n/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function copyUniversalLoader() {
      const targetUrl = window.location.origin + "/api/connect";
      const obfuscatedCode = generateObfuscatedLoader(targetUrl);
      
      navigator.clipboard.writeText(obfuscatedCode);
      Swal.fire({ title: 'Tersalin!', text: 'Loader Terenkripsi siap disebar. Script ini menggunakan manipulasi Environment dan Dynamic Hex Shift.', icon: 'success' });
    }

    async function loadScripts() {
      const container = document.getElementById('scriptList');
      try {
        const res = await fetch(API_URL, { method: 'POST', headers: SECURE_HEADER, body: JSON.stringify({ action: 'list' }) });
        const data = await res.json();

        if (!data.success || !data.scripts.length) {
          container.innerHTML = '<p style="text-align:center; color:#94a3b8;">Belum ada mod terdaftar.</p>';
          return;
        }

        container.innerHTML = data.scripts.map(s => {
          const exp = new Date(s.expiresAt).toLocaleDateString('id-ID');
          const devCount = s.devices ? JSON.parse(s.devices).length : 0;
          return `
            <div class="script-item">
              <div class="script-info">
                <div class="title">${s.name}</div>
                <div class="key">${s.key}</div>
                <div class="badges">
                  <span class="badge"><i data-lucide="calendar" style="width:12px;"></i> Exp: ${exp}</span>
                  <span class="badge"><i data-lucide="smartphone" style="width:12px;"></i> HWID: ${devCount} / ${s.maxDevices}</span>
                </div>
              </div>
              <div class="btn-group">
                <button class="btn-icon bg-orange" onclick="resetHWID('${s.key}')" title="Reset Devices"><i data-lucide="refresh-cw" style="width:16px;"></i></button>
                <button class="btn-icon bg-blue" onclick="editScript('${s.key}', '${s.name}', ${s.maxDevices})" title="Edit"><i data-lucide="edit" style="width:16px;"></i></button>
                <button class="btn-icon bg-red" onclick="deleteScript('${s.key}')" title="Hapus"><i data-lucide="trash-2" style="width:16px;"></i></button>
              </div>
            </div>
          `;
        }).join('');
        lucide.createIcons();
      } catch (e) { container.innerHTML = '<p style="color:#ef4444; text-align:center;">Gagal koneksi ke Database.</p>'; }
    }

    async function createScript() {
      const name = document.getElementById('scriptName').value || 'Untitled';
      const customKey = document.getElementById('customKey').value;
      const expireDays = document.getElementById('expireDays').value || 30;
      const maxDevices = document.getElementById('maxDevices').value || 1;
      const luaCode = document.getElementById('luaCode').value;

      const res = await fetch(API_URL, {
        method: 'POST', headers: SECURE_HEADER,
        body: JSON.stringify({ action: 'create', name, customKey, expireDays, maxDevices, luaCode })
      });
      const data = await res.json();
      if (data.success) {
        showToast('success', 'Key Deployed!');
        document.getElementById('scriptName').value = ''; document.getElementById('customKey').value = ''; document.getElementById('luaCode').value = '';
        loadScripts();
      } else Swal.fire('Error', data.message, 'error');
    }

    async function editScript(key, oldName, oldMax) {
      const { value: form } = await Swal.fire({
        title: 'Edit Mod',
        html: `
          <div style="text-align:left; font-size:14px; color:#94a3b8; font-weight:bold; margin-bottom:10px;">Nama Mod</div>
          <input id="s-name" class="swal2-input" value="${oldName}" style="width:90%; margin:0 0 20px 0;">
          <div style="text-align:left; font-size:14px; color:#94a3b8; font-weight:bold; margin-bottom:10px;">Max Devices</div>
          <input id="s-max" type="number" class="swal2-input" value="${oldMax}" style="width:90%; margin:0;">
        `,
        showCancelButton: true, confirmButtonText: 'Simpan',
        preConfirm: () => ({ name: document.getElementById('s-name').value, maxDevices: document.getElementById('s-max').value })
      });
      if (form) {
        await fetch(API_URL, { method: 'POST', headers: SECURE_HEADER, body: JSON.stringify({ action: 'edit', key, name: form.name, maxDevices: form.maxDevices }) });
        showToast('success', 'Update Berhasil!'); loadScripts();
      }
    }

    async function resetHWID(key) {
      const res = await Swal.fire({ title: 'Reset HWID?', text: "Semua device terdaftar akan dihapus", icon: 'warning', showCancelButton: true, confirmButtonColor: '#f59e0b', confirmButtonText: 'Reset' });
      if (res.isConfirmed) {
        await fetch(API_URL, { method: 'POST', headers: SECURE_HEADER, body: JSON.stringify({ action: 'reset_hwid', key }) });
        showToast('success', 'HWID direset!'); loadScripts();
      }
    }

    async function deleteScript(key) {
      const res = await Swal.fire({ title: 'Hapus Mod?', icon: 'error', showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'Hapus' });
      if (res.isConfirmed) {
        await fetch(API_URL, { method: 'POST', headers: SECURE_HEADER, body: JSON.stringify({ action: 'delete', key }) });
        showToast('success', 'Mod dihapus!'); loadScripts();
      }
    }

    loadScripts();
  </script>
</body>
</html>
